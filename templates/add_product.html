{% extends 'layout.html' %}
{% block content %}
<main class="dashboard-layout animate-fade-up">
    
    <div class="form-container" style="margin-bottom: 2rem;">
        <h2 style="margin-bottom:1.5rem">Create New Product</h2>
        <form id="productForm" enctype="multipart/form-data">
            <div class="form-group"><label>Company Name</label><input type="text" name="name" required></div>
            <div class="form-group">
                <label>Article No. (Barcode ID)</label>
                <div style="display:flex; gap:1rem; flex-wrap: wrap;">
                    <input type="text" name="article_no" id="addArticleInput" required style="flex:1;">
                    <button type="button" class="btn outline" id="btnScanBarcodeAdd" style="display:flex; align-items:center; gap:0.5rem; color:var(--text-primary); border-color:var(--border);">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 7V4h3m10 0h3v3m0 10v3h-3M4 17v3h3m2-10h6v6H9v-6z"></path></svg>
                        Scan Box
                    </button>
                </div>
                <!-- Barcode Scanner Viewport -->
                <div id="readerWrapperAdd" class="scanner-wrapper-premium" style="display:none;">
                    <div class="scanner-inner">
                        <div id="readerAdd" style="width:100%; border:none;"></div>
                        <div style="padding:1rem; text-align:center; background:var(--bg-white);">
                            <button type="button" class="btn danger" onclick="stopBarcodeScannerAdd()" style="padding:0.4rem 1rem;">Cancel Scan</button>
                            <!-- Compatibility Grid -->
                            <div class="compat-grid-scanner">
                                <div class="compat-item"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg><span>Live Cam</span></div>
                                <div class="compat-item"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg><span>Images</span></div>
                                <div class="compat-item"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg><span>Docs</span></div>
                                <div class="compat-item"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002-2z"></path></svg><span>Native</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select name="category_id" id="categorySelect" required><option value="">Select Category</option></select>
            </div>

            <div class="form-group">
                <label>MRP (₹)</label>
                <input type="number" step="0.01" name="mrp" placeholder="Maximum Retail Price" required>
            </div>
            <div class="form-group">
                <label>Default Seasonal Discount Strategy (%)</label>
                <div style="display:flex; align-items:center; gap:0.5rem">
                    <input type="number" step="0.1" name="default_discount" placeholder="e.g. 15" required style="width:100%">
                </div>
                <p style="color:var(--text-secondary); font-size:0.8rem; margin-top:0.25rem">Set based on season (e.g. 10% normal, 30% clearance).</p>
            </div>
            <div class="form-group">
                <label>Inventory Sizes & Initial Stock</label>
                <div id="sizesContainer">
                    <div style="display:flex; gap:1rem; margin-bottom:0.5rem">
                        <input type="number" class="size-val" placeholder="Size (UK) e.g. 8" required style="flex:1">
                        <input type="number" class="stock-val" placeholder="Init Stock Qty" required style="flex:1" min="0">
                    </div>
                </div>
                <button type="button" class="btn outline" onclick="addSizeRow()" style="margin-top:0.5rem; font-size:0.75rem">+ Add Another Size</button>
            </div>

            <div class="form-group">
                <label>Product Image</label>
                <style>
                    .upload-btn-choice {
                        flex:1; border: 2px dashed var(--border); padding: 1.5rem; transition: all 0.2s ease;
                        color: var(--text-primary); background: transparent; border-radius: 8px; cursor: pointer;
                    }
                    .upload-btn-choice:hover {
                        border-color: var(--primary);
                        background: rgba(59,130,246,0.05);
                        color: var(--primary);
                    }
                    #webcamModal {
                        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                        background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; flex-direction: column;
                    }
                </style>
                <div style="display:flex; gap:1rem; align-items:center;">
                    <button type="button" class="upload-btn-choice" onclick="triggerFileUpload()">
                        <span style="font-size:1.5rem; display:block; margin-bottom:0.5rem;">📁</span>
                        Upload File
                    </button>
                    <button type="button" class="upload-btn-choice" onclick="openWebcam()">
                        <span style="font-size:1.5rem; display:block; margin-bottom:0.5rem;">📸</span>
                        Take Photo
                    </button>
                </div>
                <input type="file" name="image" id="productImage" accept="image/*" style="display:none;" onchange="previewImage(this)">
                
                <div id="imagePreviewContainer" style="margin-top: 1rem; display: none; text-align: center;">
                    <img id="imagePreview" src="" alt="Preview" style="max-height: 200px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 0.5rem;">
                    <div>
                        <button type="button" class="btn outline" style="color:var(--danger); border-color:var(--danger); padding:0.5rem 1rem; font-size:0.8rem;" onclick="clearImage()">Remove Photo</button>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn primary full-width" style="margin-top:1rem; padding:1rem; font-size:1.1rem;">Save New Product</button>
        </form>
    </div>

    <div class="form-container">
        <h2 style="margin-bottom:1.5rem">Manage Categories</h2>
        <form id="categoryForm">
            <div class="form-group"><label>Category Name</label><input type="text" id="catName" required></div>
            <button type="submit" class="btn outline full-width" style="border-color:var(--primary); color:var(--primary)">Add Category</button>
        </form>
    </div>

    <!-- Webcam Modal -->
    <div id="webcamModal">
        <div style="background: white; padding: 2rem; border-radius: 12px; text-align: center; max-width: 90vw;">
            <h3 style="margin-bottom: 1rem;">Take a Photo</h3>
            <video id="webcamVideo" autoplay playsinline style="width: 100%; max-width: 400px; border-radius: 8px; background: #000; margin-bottom: 1rem;"></video>
            <canvas id="webcamCanvas" style="display:none;"></canvas>
            <div style="display:flex; gap: 1rem; justify-content: center;">
                <button type="button" class="btn outline" onclick="closeWebcam()">Cancel</button>
                <button type="button" class="btn primary" onclick="snapPhoto()">📸 Snap Photo</button>
            </div>
        </div>
    </div>

</main>
{% endblock %}
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadCategoryDropdown();
        document.getElementById('categoryForm').addEventListener('submit', handleCategorySubmit);
        document.getElementById('productForm').addEventListener('submit', handleProductSubmit);
    });

    function addSizeRow() {
        const cont = document.getElementById('sizesContainer');
        const row = document.createElement('div');
        row.style.display = 'flex'; row.style.gap = '1rem'; row.style.marginBottom = '0.5rem';
        row.innerHTML = `
            <input type="number" class="size-val" placeholder="Size (UK)" required style="flex:1">
            <input type="number" class="stock-val" placeholder="Init Stock Qty" required style="flex:1" min="0">
            <button type="button" class="btn danger" onclick="this.parentElement.remove()">X</button>
        `;
        cont.appendChild(row);
    }

    function triggerFileUpload() {
        document.getElementById('productImage').click();
    }

    let stream = null;
    
    async function openWebcam() {
        const modal = document.getElementById('webcamModal');
        const video = document.getElementById('webcamVideo');
        modal.style.display = 'flex';
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
        } catch (err) {
            alert('Camera access denied or unavailabe.');
            closeWebcam();
        }
    }

    function closeWebcam() {
        document.getElementById('webcamModal').style.display = 'none';
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
    }

    function snapPhoto() {
        const video = document.getElementById('webcamVideo');
        const canvas = document.getElementById('webcamCanvas');
        if (!stream) return;
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const dataUrl = canvas.toDataURL('image/jpeg');
        
        // Convert to file
        let arr = dataUrl.split(','), mime = arr[0].match(/:(.*?);/)[1];
        let bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
        while(n--){ u8arr[n] = bstr.charCodeAt(n); }
        let file = new File([u8arr], "webcam_photo.jpg", {type:mime});
        
        let container = new DataTransfer();
        container.items.add(file);
        const fileInput = document.getElementById('productImage');
        fileInput.files = container.files;
        
        previewImage(fileInput);
        closeWebcam();
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('imagePreviewContainer').style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function clearImage() {
        document.getElementById('productImage').value = '';
        document.getElementById('imagePreviewContainer').style.display = 'none';
        document.getElementById('imagePreview').src = '';
    }
</script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
    // Native Barcode Scanner Integration for Data Entry
    let html5QrcodeScannerAdd = null;

    document.getElementById('btnScanBarcodeAdd').addEventListener('click', () => {
        document.getElementById('readerWrapperAdd').style.display = 'block';
        
        if (!html5QrcodeScannerAdd) {
            html5QrcodeScannerAdd = new Html5QrcodeScanner(
                "readerAdd",
                { fps: 10, qrbox: {width: 300, height: 200}, aspectRatio: 1.0 },
                /* verbose= */ false
            );
            
            html5QrcodeScannerAdd.render(onScanSuccessAdd, onScanFailureAdd);
        }
    });

    function stopBarcodeScannerAdd() {
        document.getElementById('readerWrapperAdd').style.display = 'none';
        if (html5QrcodeScannerAdd) {
            try {
                html5QrcodeScannerAdd.clear();
            } catch(e) {}
            html5QrcodeScannerAdd = null;
        }
    }

    async function onScanSuccessAdd(decodedText, decodedResult) {
        // Stop scanning immediately on success
        stopBarcodeScannerAdd();
        
        // Populate the input with barcode
        const searchInput = document.getElementById('addArticleInput');
        searchInput.value = decodedText;
        showToast("Barcode Scanned: " + decodedText);

        // Intelligent Local Auto-Fill: Search your own inventory history first
        const matchedProduct = (typeof productsCache !== 'undefined') ? productsCache.find(p => p.article_no === decodedText) : null;
        
        if (matchedProduct) {
            const nameInput = document.querySelector('input[name="name"]');
            const mrpInput = document.querySelector('input[name="mrp"]');
            const discInput = document.querySelector('input[name="default_discount"]');
            const catSelect = document.getElementById('categorySelect');

            if (nameInput) nameInput.value = matchedProduct.name || '';
            if (mrpInput) mrpInput.value = matchedProduct.mrp || '';
            if (discInput) discInput.value = matchedProduct.default_discount || 0;
            if (catSelect) catSelect.value = matchedProduct.category_id || "";

            showToast("Existing Product Data Auto-Filled!");
            return; // Exit if matched locally
        }

        // Fallback to Global Database if not found in your inventory
        showToast("Looking up Global Database...");
        try {
            const apiRes = await fetch(`https://api.upcitemdb.com/prod/trial/lookup?upc=${decodedText}`);
            const apiData = await apiRes.json();
            
            if (apiData && apiData.items && apiData.items.length > 0) {
                const item = apiData.items[0];
                const nameInput = document.querySelector('input[name="name"]');
                if (nameInput) {
                    nameInput.value = item.title || item.brand || '';
                    showToast("Global Branding Auto-Filled!");
                }
            } else {
                showToast("New Product Detected. Please enter manually.");
            }
        } catch(e) {
            console.log("Global DB lookup failed", e);
        }
    }

    function onScanFailureAdd(error) {
        // handle scan failure silently
    }
</script>
{% endblock %}
