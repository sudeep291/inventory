{% extends 'layout.html' %}
{% block head %}
<link rel="preload" as="image" href="/static/images/footwear_bg_1.webp" fetchpriority="high">
<link rel="preload" as="image" href="/static/images/footwear_bg_2.webp">
<link rel="preload" as="image" href="/static/images/footwear_bg_3.webp">
{% endblock %}
{% block content %}
<main class="dashboard-layout">
<style>
.welcome-slider-container {
    position: relative;
    margin: 4rem 0 5rem 0;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08);
}
/* ⬇️ Dim the actual background images — was over-bright */
.bg-slide {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    animation: bgFade 9s infinite;
    z-index: 0;
    filter: brightness(0.45) saturate(1.1); /* ← KEY FIX: dims image by 55% */
}
.bg-slide:nth-child(1) { animation-delay: 0s; }
.bg-slide:nth-child(2) { animation-delay: 3s; }
.bg-slide:nth-child(3) { animation-delay: 6s; }

@keyframes bgFade {
    0% { opacity: 0; transform: scale(1.05); }
    10% { opacity: 1; transform: scale(1); }
    33% { opacity: 1; transform: scale(1); }
    43% { opacity: 0; transform: scale(1.05); }
    100% { opacity: 0; transform: scale(1.05); }
}

/* Dark cinematic gradient overlay — replaces the white wash */
.welcome-overlay {
    position: relative;
    z-index: 2;
    padding: 5rem 2rem;
    text-align: center;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.1) 0%,
        rgba(0,0,0,0.05) 50%,
        rgba(0,0,0,0.2) 100%
    );
}
</style>

    <div class="welcome-slider-container">
        <div class="bg-slide" style="background-image:url('/static/images/footwear_bg_1.webp');"></div>
        <div class="bg-slide" style="background-image:url('/static/images/footwear_bg_2.webp');"></div>
        <div class="bg-slide" style="background-image:url('/static/images/footwear_bg_3.webp');"></div>
        
        <div class="welcome-overlay">
            <!-- Premium Animation Styles -->
            <style>
            /* 1. Entrance: text fades in with stagger */
            @keyframes heroEntrance {
                from { opacity: 0; transform: translateY(22px); }
                to   { opacity: 1; transform: translateY(0); }
            }
            /* 2. Infinite float — subtle, never distracting */
            @keyframes premiumFloat {
                0%, 100% { transform: translateY(0px); }
                50%       { transform: translateY(-8px); }
            }
            /* 3. Shimmer sweep for gradient name */
            @keyframes shimmerSweep {
                0%   { background-position: -200% center; }
                100% { background-position: 200% center; }
            }
            /* 4. Mint glow pulse — split-complementary to the pink-purple above */
            @keyframes mintPulse {
                0%, 100% { text-shadow: 0 1px 12px rgba(0,0,0,0.6), 0 0 0px rgba(110,231,183,0); }
                50%       { text-shadow: 0 1px 12px rgba(0,0,0,0.6), 0 0 22px rgba(110,231,183,0.5); }
            }

            .hero-text-block {
                animation: heroEntrance 0.5s ease forwards, premiumFloat 5s ease-in-out 0.6s infinite;
                will-change: transform;
            }
            .hero-welcome-word {
                display: inline-block;
                animation: heroEntrance 0.4s ease 0.1s both;
                color: #ffffff;
            }
            .hero-name {
                display: inline-block;
                background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 40%, #f9a8d4 70%, #60a5fa 100%);
                background-size: 200% auto;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                animation: heroEntrance 0.4s ease 0.25s both, shimmerSweep 4s linear 1s infinite;
                will-change: background-position;
                cursor: default;
                transition: transform 0.3s ease;
            }
            .hero-name:hover {
                transform: scale(1.04);
                filter: drop-shadow(0 0 16px rgba(167,139,250,0.7));
            }
            .hero-subtitle {
                color: #6ee7b7;
                font-weight: 500;
                letter-spacing: 0.6px;
                animation: heroEntrance 0.4s ease 0.4s both, mintPulse 3s ease-in-out 1s infinite;
                will-change: text-shadow;
            }
            </style>

            <div class="hero-text-block">
                <h1 style="font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 800; letter-spacing: -1px; text-shadow: 0 2px 20px rgba(0,0,0,0.6); margin-bottom: 1rem; line-height:1.2;">
                    <span class="hero-welcome-word">Welcome</span><br>
                    <span class="hero-name">Mr. Prathap Avula</span>
                </h1>
                <p class="hero-subtitle" style="font-size: 1.1rem; text-shadow: 0 1px 12px rgba(0,0,0,0.6);">
                    to Sri Vijayalakshmi Footwear Inventory System
                </p>
            </div>
        </div>
    </div>
    
    <div class="summary-cards" id="dashCards"></div>
    
    <div class="table-container" style="margin-top:2rem">
        <div class="section-title"><h2>Critical Low Stock Alerts</h2></div>
        <table>
            <thead><tr><th>Article No</th><th>Product Name</th><th>Size</th><th>Stock Remaining</th></tr></thead>
            <tbody id="lowStockAlerts"></tbody>
        </table>
    </div>
</main>
{% endblock %}
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', loadWelcomeDashboard);
</script>
{% endblock %}
