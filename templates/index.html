{% extends 'layout.html' %}
{% block head %}
<link rel="preload" as="image" href="/static/images/footwear_bg_1.webp" fetchpriority="high">
<link rel="preload" as="image" href="/static/images/footwear_bg_2.webp">
<link rel="preload" as="image" href="/static/images/footwear_bg_3.webp">
{% endblock %}
{% block content %}
<main class="dashboard-layout">
<style>
.welcome-slider-container {
    position: relative;
    margin: 4rem 0 5rem 0;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08);
}
/* ⬇️ Dim the actual background images — was over-bright */
.bg-slide {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    animation: bgFade 9s infinite;
    z-index: 0;
    filter: brightness(0.45) saturate(1.1); /* ← KEY FIX: dims image by 55% */
}
.bg-slide:nth-child(1) { animation-delay: 0s; }
.bg-slide:nth-child(2) { animation-delay: 3s; }
.bg-slide:nth-child(3) { animation-delay: 6s; }

@keyframes bgFade {
    0% { opacity: 0; transform: scale(1.05); }
    10% { opacity: 1; transform: scale(1); }
    33% { opacity: 1; transform: scale(1); }
    43% { opacity: 0; transform: scale(1.05); }
    100% { opacity: 0; transform: scale(1.05); }
}

/* Dark cinematic gradient overlay — replaces the white wash */
.welcome-overlay {
    position: relative;
    z-index: 2;
    padding: 5rem 2rem;
    text-align: center;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.1) 0%,
        rgba(0,0,0,0.05) 50%,
        rgba(0,0,0,0.2) 100%
    );
}
</style>

    <div class="welcome-slider-container">
        <div class="bg-slide" style="background-image:url('/static/images/footwear_bg_1.webp');"></div>
        <div class="bg-slide" style="background-image:url('/static/images/footwear_bg_2.webp');"></div>
        <div class="bg-slide" style="background-image:url('/static/images/footwear_bg_3.webp');"></div>
        
        <div class="welcome-overlay">
            <h1 style="font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 800; color: #ffffff; letter-spacing: -1px; text-shadow: 0 2px 20px rgba(0,0,0,0.6); margin-bottom: 1rem; line-height:1.2;">
                Welcome <br> <span style="background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">Mr. Prathap Avula</span>
            </h1>
            <p style="font-size: 1.1rem; color: #fcd34d; font-weight: 600; text-shadow: 0 1px 12px rgba(0,0,0,0.6); letter-spacing: 0.5px;">
                to Sri Vijayalakshmi Footwear Inventory System
            </p>
        </div>
    </div>
    
    <div class="summary-cards" id="dashCards"></div>
    
    <div class="table-container" style="margin-top:2rem">
        <div class="section-title"><h2>Critical Low Stock Alerts</h2></div>
        <table>
            <thead><tr><th>Article No</th><th>Product Name</th><th>Size</th><th>Stock Remaining</th></tr></thead>
            <tbody id="lowStockAlerts"></tbody>
        </table>
    </div>
</main>
{% endblock %}
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', loadWelcomeDashboard);
</script>
{% endblock %}
