{% extends 'layout.html' %}
{% block head %}
<link rel="preload" as="image" href="/static/images/bg_sell_product.webp" fetchpriority="high">
{% endblock %}
{% block content %}
<style>
    body {
        background: url('/static/images/bg_sell_product.webp') no-repeat center center fixed !important;
        background-size: cover !important;
    }
    .form-container {
        background: rgba(15, 23, 42, 0.6) !important;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }
    .form-container h2, .form-container p, .form-container label, .form-container h3, .form-container strong {
        color: #ffffff !important;
    }
    .form-container .result-card {
        background: rgba(0,0,0,0.2) !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
    }
    body[data-theme='dark'] .form-container {
        background: rgba(15, 23, 42, 0.3) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    /* Premium High-Contrast Luminous Overrides */
    .premium-result-card h3 { 
        font-size: 2.25rem !important; 
        font-weight: 800 !important; 
        margin-bottom: 0.75rem !important; 
    }
    .premium-result-card p { 
        font-size: 1.4rem !important; 
        color: #475569 !important;
        margin-bottom: 1rem !important; 
        display: flex;
        justify-content: flex-start; /* Reduced space between key and value */
        gap: 2rem;
        align-items: center;
        flex-wrap: wrap; /* Defensive Scaling */
        border-bottom: 1px dashed #e2e8f0;
        padding-bottom: 0.75rem;
    }
    .premium-result-card .val {
        font-weight: 800 !important;
    }
    .premium-result-card label {
        font-size: 1rem !important;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 1.5rem;
        display: block;
        font-weight: 800 !important;
    }
    .lbl-input { color: #312e81 !important; margin-bottom: 0.5rem !important; } /* Deep Indigo */
    
    /* Distinct Attribute Colours for High Visibility */
    .text-brand-label {
        font-size: 1.15rem !important; /* Increased font size for keys */
        font-weight: 850 !important;
        min-width: 140px;
    }
    .lbl-mrp { color: #2563eb !important; }      /* Bright Blue */
    .lbl-strategy { color: #9333ea !important; } /* Bright Purple */
    .lbl-sold { color: #059669 !important; }     /* Bright Emerald */
    
    /* Specific overrides to prevent global white text from washing out labels */
    .premium-result-card h3, .text-brand-primary { color: #dc2626 !important; } /* Red Product Name */
    .premium-result-card strong { color: #111827 !important; font-weight: 800 !important; } /* Deep Black Size/UK */
    
    .exec-size-item { 
        background: #ffffff !important; 
        color: #111827 !important; 
        border: 2px solid #e2e8f0 !important;
        font-weight: 800 !important; 
    }
    .exec-size-item:hover {
        border-color: #dc2626 !important;
        background: #fef2f2 !important;
    }
</style>
<main class="dashboard-layout animate-fade-up">
    <div class="form-container">
        <h2 style="margin-bottom:1rem">Execute Sale</h2>
        <p style="color:var(--text-secondary); margin-bottom:2rem;">Search to find item and process sale.</p>
        
        <div class="search-section" style="text-align:left; margin-bottom:2rem;">
            <label style="font-weight:600;display:block;margin-bottom:0.5rem">Search Article No.</label>
            <div style="display:flex; gap:1rem; flex-wrap: wrap;">
                <div style="flex:1; position:relative;"><input type="text" id="sellSearchInput" placeholder="ex. ART-101" style="width:100%;" autocomplete="off"><div id="sellSuggestions" class="search-suggestions-box"></div></div>
                <button type="button" class="btn-search-mix" onclick="searchSellProduct()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="margin-right:0.5rem"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Search Item
                </button>
                <button type="button" class="btn-scan-mix" id="btnScanBarcode">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 7V4h3m10 0h3v3m0 10v3h-3M4 17v3h3m2-10h6v6H9v-6z"></path></svg>
                    <span>Scan Box</span>
                </button>
            </div>
            <!-- Barcode Scanner Viewport -->
            <div id="readerWrapper" class="scanner-wrapper-premium" style="display:none;">
                <div class="scanner-inner">
                    <div id="reader" style="width:100%; border:none;"></div>
                    <div style="padding:1rem; text-align:center; background:var(--bg-white);">
                        <button class="btn danger" onclick="stopBarcodeScanner()" style="padding:0.4rem 1rem;">Cancel Scan</button>
                    </div>
                </div>
            </div>

        <div id="sellResultContainer" style="display:none; padding-top:2rem; border-top:1px solid rgba(255,255,255,0.1)">
            <div class="premium-result-card">
                <div class="img-hover-container premium-img-border" onclick="openLightbox(document.getElementById('sellResImg').src)">
                    <img id="sellResImg" src="" alt="Product" style="width:100%; height:100%; object-fit:cover;" loading="lazy" onload="optimizeImage(this)">
                    <div class="img-hover-btn">ðŸ” PREVIEW</div>
                </div>
                <div class="result-info">
                    <h3 id="sellResName" class="text-brand-primary"></h3>
                    
                    <p class="text-brand-mrp">
                        <span class="text-brand-label lbl-mrp">Target MRP:</span>
                        <span class="val">Rs. <span id="sellResMRP"></span></span>
                    </p>
                    
                    <p class="text-brand-strategy">
                        <span class="text-brand-label lbl-strategy">Base Strategy:</span>
                        <span class="val"><span id="sellResBaseDisc"></span>% OFF</span>
                    </p>
                    
                    <p class="text-brand-success">
                        <span class="text-brand-label lbl-sold">Target Sold:</span>
                        <span class="val">Rs. <span id="sellResSold"></span></span>
                    </p>
                    
                    <label class="text-brand-label lbl-input" style="margin-top:2rem;">Select Size to Buy</label>
                    <div id="sellResSizes" class="exec-size-list"></div>
                </div>
            </div>
            
            <form id="executeSaleForm" style="display:none; background:var(--bg-base); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-top:2rem; animation:fadeUp 0.5s ease forwards;">
                <h3 style="margin-bottom:1.5rem; border-bottom:1px solid var(--border); padding-bottom:1rem; font-size:1.1rem; color:var(--text-primary)">Checkout Configuration</h3>
                <input type="hidden" id="sale_size_id">
                
                <div class="form-group">
                    <label>Quantity Sold</label>
                    <input type="number" id="sale_qty" min="1" value="1" required oninput="calcSalePreview()">
                </div>
                
                <div class="form-group">
                    <label>Item Sold For (Rs.)</label>
                    <input type="number" step="0.01" id="sale_sp" required oninput="calcSaleFromPrice()" style="background:#f1f5f9; color:#0f172a; font-weight:700; border:2px solid #3b82f6;">
                    <input type="hidden" id="sale_discount">
                </div>
                
                <div id="liveProfitCalc" style="background:var(--bg-white); padding:1rem; border-radius:8px; text-align:center; margin-bottom:1.5rem; border:1px solid var(--border); transition:all 0.3s">
                    <span id="salePreviewVal" style="font-size:1.1rem; font-weight:700">Waiting for setup...</span>
                </div>
                
                <button type="submit" class="btn primary full-width" style="padding:1.15rem; font-size:1.1rem; border-radius:12px; box-shadow:0 10px 20px rgba(59,130,246,0.3)">Complete Sale</button>
            </form>
        </div>
    </div>
</main>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
    document.getElementById('executeSaleForm').addEventListener('submit', handleSaleSubmit);

        // Enhanced 1-Click Barcode Scanner for Sales (Purity Filter)
    let html5QrcodeScanner = null;

    const cleanBarcode = (text) => {
        let cleaned = text.replace(/[^\d]/g, "");
        
        // 1. Priority: Find any 13-digit Indian barcode (starts with 890) hidden in noise
        if (cleaned.includes("890")) {
            const startIdx = cleaned.indexOf("890");
            const possible = cleaned.substring(startIdx, startIdx + 13);
            if (possible.length === 13) return possible;
        }

        // 2. Secondary: If we have exactly 13 digits (any brand), take it
        if (cleaned.length === 13) return cleaned;

        // 3. Fallback: Return whatever digits we found (handles EAN-8 or non-standard)
        return cleaned;
    };

    
    // --- Manual Search Suggestions Logic ---
    const sellInput = document.getElementById('sellSearchInput');
    const sellSuggBox = document.getElementById('sellSuggestions');

    sellInput.addEventListener('input', () => {
        const q = sellInput.value.trim().toLowerCase();
        if (q.length < 1) { sellSuggBox.style.display = 'none'; return; }
        
        const matches = productsCache.filter(p => 
            p.article_no.toLowerCase().includes(q) || 
            (p.barcode && p.barcode.toLowerCase().includes(q)) ||
            p.name.toLowerCase().includes(q)
        ).slice(0, 8);

        if (matches.length > 0) {
            sellSuggBox.innerHTML = matches.map(p => `
                <div class="suggestion-item" onclick="selectSellSuggestion('${p.article_no}')">
                    <span class="art-no">${p.article_no}</span>
                    <span class="prod-name">${p.name}</span>
                </div>
            `).join('');
            sellSuggBox.style.display = 'block';
        } else {
            sellSuggBox.style.display = 'none';
        }
    });

    window.selectSellSuggestion = (artNo) => {
        sellInput.value = artNo;
        sellSuggBox.style.display = 'none';
        searchSellProduct();
    };

    document.addEventListener('click', (e) => {
        if (!sellInput.contains(e.target) && !sellSuggBox.contains(e.target)) {
            sellSuggBox.style.display = 'none';
        }
    });
    // --- End Suggestions Logic ---

    document.getElementById('btnScanBarcode').addEventListener('click', async () => {
        document.getElementById('readerWrapper').style.display = 'block';
        
        if (!html5QrcodeScanner) {
            html5QrcodeScanner = new Html5Qrcode('reader');
        }

        try {
            await html5QrcodeScanner.start(
                { facingMode: 'environment' }, 
                { 
                    fps: 20, 
                    qrbox: { width: 300, height: 200 },
                    formatsToSupport: [ 
                        Html5QrcodeSupportedFormats.EAN_13, 
                        Html5QrcodeSupportedFormats.CODE_128 
                    ]
                },
                (decodedText) => {
                    stopBarcodeScanner();
                    
                    const finalCode = cleanBarcode(decodedText);
                    let foundArticleNo = finalCode;

                    if (typeof productsCache !== 'undefined' && productsCache) {
                        const matchedP = productsCache.find(p => p.barcode === finalCode || p.article_no.toUpperCase() === finalCode.toUpperCase());
                        if (matchedP && matchedP.article_no) {
                            foundArticleNo = matchedP.article_no;
                        }
                    }

                    const searchInput = document.getElementById('sellSearchInput');
                    searchInput.value = foundArticleNo;
                    showToast("âœ… Auto-Fetched: " + foundArticleNo);
                    
                    setTimeout(() => {
                        searchSellProduct();
                    }, 300);
                },
                (err) => {}
            );
        } catch (err) {
            console.error(err);
            showToast("â Œ Scanner Error");
            document.getElementById('readerWrapper').style.display = 'none';
        }
    });

    function stopBarcodeScanner() {
        document.getElementById('readerWrapper').style.display = 'none';
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().catch(() => {}).finally(() => {
                html5QrcodeScanner = null;
                document.getElementById('reader').innerHTML = '';
            });
        }
    }
</script>
{% endblock %}
