{% extends 'layout.html' %}
{% block head %}
<link rel="preload" as="image" href="/static/images/bg_update_stock.png">
{% endblock %}
{% block content %}
<style>
    body {
        background: url('/static/images/bg_update_stock.png') no-repeat left center fixed !important;
        background-size: cover !important;
    }
    .form-container {
        background: rgba(15, 23, 42, 0.6) !important;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        max-width: 700px !important; /* Adjusted for tighter focus */
    }
    .form-container h2, .form-container p, .form-container label, .form-container h3, .form-container strong {
        color: #ffffff !important;
    }
    .form-container .result-card {
        background: rgba(0,0,0,0.2) !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
    }
    /* Premium High-Contrast Luminous Overrides */
    .premium-result-card h3 { 
        font-size: 2.25rem !important; 
        font-weight: 800 !important; 
        margin-bottom: 0.75rem !important; 
    }
    .premium-result-card p { 
        font-size: 1.3rem !important; 
        color: #475569 !important;
        margin-bottom: 0.75rem !important; 
        display: flex;
        justify-content: space-between;
        border-bottom: 1px dashed #e2e8f0;
        padding-bottom: 0.5rem;
    }
    .premium-result-card .val {
        font-weight: 800 !important;
    }
    .premium-result-card label {
        font-size: 1rem !important;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 1.5rem;
        display: block;
        font-weight: 800 !important;
    }
    /* Distinct Attribute Colours for High Visibility */
    .lbl-mrp { color: #2563eb !important; font-weight: 900 !important; font-size:0.85rem !important;}      /* Bright Blue */
    .lbl-strategy { color: #9333ea !important; font-weight: 900 !important; font-size:0.85rem !important;} /* Bright Purple */
    .lbl-sold { color: #059669 !important; font-weight: 900 !important; font-size:0.85rem !important;}     /* Bright Emerald */
    .lbl-input { color: #312e81 !important; margin-bottom: 0.5rem !important; } /* Deep Indigo */
    
    .btn-premium-add {
        background: #334155;
        color: rgb(237, 233, 233);
        padding: 0.8rem;
        border-radius: 8px;
        font-weight: 700;
        border: none;
        width: 100%;
        margin-top: 2rem;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn-premium-add:hover {
        background: #1e293b;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
</style>
<main class="dashboard-layout animate-fade-up">
    <div class="form-container">
        <h2 style="margin-bottom:1rem">Batch Update Existing Stock</h2>
        <p style="color:var(--text-secondary); margin-bottom:2rem;">Search to find item and update multiple sizes simultaneously.</p>
        
        <div class="search-section" style="text-align:left; margin-bottom:2rem;">
            <label style="font-weight:600;display:block;margin-bottom:0.5rem">Search Article No.</label>
            <div style="display:flex; gap:1rem; align-items:center;">
                <input type="text" id="updateSearchInput" placeholder="ex. ART-101" style="flex:1;">
                <button type="button" class="btn primary" onclick="searchUpdateProduct()">Search Item</button>
            </div>
        </div>

        <div id="updateResultContainer" style="display:none; padding-top:2rem; border-top:1px solid rgba(255,255,255,0.1)">
            <div class="premium-result-card">
                <div class="img-hover-container premium-img-border" onclick="openLightbox(document.getElementById('updateResImg').src)">
                    <img id="updateResImg" src="" alt="Product" style="width:100%; height:100%; object-fit:cover;" loading="lazy" onload="optimizeImage(this)">
                    <div class="img-hover-btn">🔍 PREVIEW</div>
                </div>
                <div class="result-info">
                    <h3 id="updateResName" style="color:#ef4444 !important"></h3>
                    
                    <p class="text-brand-mrp" style="height:auto; padding:1rem 0;">
                        <span class="text-brand-label lbl-mrp" style="font-size:1rem !important">Target MRP:</span>
                        <span class="val" style="font-size:1.8rem !important; display:flex; align-items:center;">
                            ₹<input type="number" id="updateResCP" step="0.01" style="background:transparent; border:none; color:inherit; font-weight:inherit; font-size:inherit; width:150px; outline:none; border-bottom:2px solid #2563eb" oninput="resyncUpdateSold()">
                        </span>
                    </p>
                    
                    <p class="text-brand-success" style="margin-bottom:1.5rem; height:auto; padding:1rem 0; border-bottom:1px dashed #e2e8f0;">
                        <span class="text-brand-label lbl-sold" style="font-size:1rem !important">Target Sold:</span>
                        <span class="val" style="font-size:1.8rem !important">₹<span id="updateResSold"></span></span>
                    </p>
                    
                    <label class="text-brand-label lbl-input" style="display:block; margin-bottom:1rem;">Input Quantities to Add</label>
                    <div id="updateResSizes" style="display:flex; flex-direction:column; gap:1rem; margin-top:0.75rem;"></div>
                    <button type="button" class="btn-premium-add" onclick="addNewUpdateSizeRow()">+ Add New Size Variation</button>
                </div>
            </div>

            <button type="button" onclick="previewBatchUpdate()" id="btnPreviewBatch" class="btn success full-width" style="padding:1rem; font-size:1.1rem" disabled>CONFIRM STOCK UPDATE</button>
        </div>
    </div>
</main>

<!-- Confirmation Intent Modal -->
<div id="batchConfirmModal" class="modal" style="display:none; position:fixed; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center; transform:none; border-radius:0;">
    <div class="form-container" style="background:var(--bg-white); padding:2rem; border-radius:var(--radius); max-width:400px; width:100%; box-shadow:var(--shadow-hover); color:var(--text-primary); text-align:left;">
        <h3 style="margin-bottom:1rem; font-size:1.25rem; font-weight:600; color:var(--text-primary);">Verify Batch Update</h3>
        <p style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:1rem;">Do you want to apply the following additions?</p>
        <div id="batchSummaryList" style="margin-bottom:1.5rem; background:#f8fafc; padding:1rem; border-radius:8px; font-weight:500;">
        </div>
        <div style="display:flex; gap:1rem;">
            <button class="btn outline" onclick="document.getElementById('batchConfirmModal').style.display='none'" style="flex:1">Cancel</button>
            <button class="btn success" onclick="executeBatchUpdate()" style="flex:1">Commit Updates</button>
        </div>
    </div>
</div>
{% endblock %}
