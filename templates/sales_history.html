{% extends 'layout.html' %}
{% block content %}
<main class="dashboard-layout">
    <div class="search-section">
        <h2 style="margin-bottom:1rem">History</h2>
        <p style="color:var(--text-secondary); margin-bottom:2rem">Complete history of all recorded product sales.</p>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; gap:1rem; flex-wrap:wrap;">
            <div style="flex:1; display:flex; gap:0.5rem; position:relative;">
                <input type="text" id="ledgerSearch" placeholder="Search Article or Name..." autocomplete="off" style="flex:1;">
                <div id="ledgerSuggestions" class="search-suggestions-box"></div>
                <button type="button" class="btn-search-mix" onclick="filterLedger()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="margin-right:0.5rem"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <span>Search</span>
                </button>
            </div>
            <button type="button" class="btn-scan-mix" id="btnScanBarcodeHistory">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 7V4h3m10 0h3v3m0 10v3h-3M4 17v3h3m2-10h6v6H9v-6z"></path></svg>
                <span>Scan Box</span>
            </button>
        </div>

        <!-- Barcode Scanner Viewport -->
        <div id="readerWrapperHistory" class="scanner-wrapper-premium" style="display:none; margin-bottom:2rem;">
            <div class="scanner-inner">
                <div id="readerHistory" style="width:100%; border:none;"></div>
                <div style="padding:1rem; text-align:center; background:var(--bg-white);">
                    <button type="button" class="btn danger" onclick="stopBarcodeScannerHistory()" style="padding:0.4rem 1rem;">Cancel Scan</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="table-container animate-fade-up">
        <table id="ledgerTable">
            <thead>
                <tr>
                    <th>Date & Time</th>
                    <th>Article No</th>
                    <th>Company Name</th>
                    <th>Size</th>
                    <th>Qty</th>
                    <th>MRP / Unit</th>
                    <th>Sold Price</th>
                    <th>Discount Given</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="ledgerBody">
                <tr><td colspan="9" style="text-align:center; padding:3rem;">Loading ledger...</td></tr>
            </tbody>
        </table>
    </div>
</main>
{% endblock %}
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadLedger();
        
        // --- History Live Suggestions Logic ---
        const ledgerInp = document.getElementById('ledgerSearch');
        const ledgerSugg = document.getElementById('ledgerSuggestions');

        ledgerInp.addEventListener('input', () => {
            const q = ledgerInp.value.trim().toLowerCase();
            if (q.length < 1) { 
                ledgerSugg.style.display = 'none'; 
                filterLedger(); // Reset filter on clear
                return; 
            }
            
            // Extract unique article names from table to suggest
            const currentRows = Array.from(document.querySelectorAll('#ledgerBody tr'));
            const rowArticles = currentRows
                .map(tr => tr.cells[1]?.innerText)
                .filter((v, i, a) => v && a.indexOf(v) === i && v.toLowerCase().includes(q));

            if (rowArticles.length > 0) {
                ledgerSugg.innerHTML = rowArticles.slice(0, 5).map(art => `
                    <div class="suggestion-item" onclick="selectLedgerSuggestion('${art}')">
                        <span class="art-no">${art}</span>
                    </div>
                `).join('');
                ledgerSugg.style.display = 'block';
            } else {
                ledgerSugg.style.display = 'none';
            }
            filterLedger(); // Filter live as they type
        });

        window.selectLedgerSuggestion = (art) => {
            ledgerInp.value = art;
            ledgerSugg.style.display = 'none';
            filterLedger();
        };

        document.addEventListener('click', (e) => {
            if (!ledgerInp.contains(e.target)) ledgerSugg.style.display = 'none';
        });
    });

    async function loadLedger() {
        try {
            const res = await fetch('/api/sales_history');
            const data = await res.json();
            if(data.error) return;
            
            const tbody = document.getElementById('ledgerBody');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding:3rem;">No sales recorded yet.</td></tr>';
                return;
            }
            
            data.forEach(s => {
                let statusBadge = '';
                const isReturn = s.status === 'RETURNED';
                
                if (isReturn) {
                    statusBadge = '<span class="status-badge-returned">Returned</span>';
                } else {
                    if(s.discount < 10) statusBadge = '<span class="badge" style="background:#dcfce7; color:#16a34a">Premium</span>';
                    else if(s.discount <= 25) statusBadge = '<span class="badge" style="background:#fef3c7; color:#d97706">Standard</span>';
                    else statusBadge = '<span class="badge" style="background:#fee2e2; color:#dc2626">Clearance</span>';
                }
                
                // Construct Date
                const dateObj = new Date(s.date);
                const dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                const tr = document.createElement('tr');
                if (isReturn) {
                    tr.style.opacity = '0.8';
                    tr.style.background = 'rgba(239, 68, 68, 0.03)';
                }
                
                tr.innerHTML = `
                    <td style="font-size:0.85rem">${dateStr}</td>
                    <td style="font-weight:600">${s.article}</td>
                    <td>${s.name}</td>
                    <td>${s.size}</td>
                    <td style="font-weight:700">${isReturn ? '-' : ''}${s.qty}</td>
                    <td>₹${typeof toMoney === 'function' ? toMoney(s.mrp) : s.mrp.toLocaleString()}</td>
                    <td style="font-weight:600; color:${isReturn ? '#dc2626' : 'inherit'}">${isReturn ? '-' : ''}₹${typeof toMoney === 'function' ? toMoney(s.sold_price) : s.sold_price.toLocaleString()}</td>
                    <td>${s.discount || 0}%</td>
                    <td>${statusBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch(e) { 
            console.error(e);
        }
    }
    
    function filterLedger() {
        const term = document.getElementById('ledgerSearch').value.toLowerCase();
        Array.from(document.getElementById('ledgerBody').rows).forEach(row => {
            if(row.cells.length < 2) return;
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(term) ? '' : 'none';
        });
    }
</script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
    // Improved 1-Click History Audit Scanner (Purity Filter)
    let historyScanner = null;

    const cleanBarcode = (text) => {
        let cleaned = text.replace(/[^\d]/g, "");
        if (cleaned.startsWith("890") && cleaned.length > 13) cleaned = cleaned.substring(0, 13);
        return cleaned;
    };

    document.getElementById('btnScanBarcodeHistory').addEventListener('click', async () => {
        document.getElementById('readerWrapperHistory').style.display = 'block';
        if (!historyScanner) historyScanner = new Html5Qrcode('readerHistory');
        
        try {
            await historyScanner.start(
                { facingMode: 'environment' }, 
                { 
                    fps: 20, 
                    qrbox: { width: 300, height: 200 },
                    formatsToSupport: [ 
                        Html5QrcodeSupportedFormats.EAN_13, 
                        Html5QrcodeSupportedFormats.CODE_128 
                    ]
                },
                (decodedText) => {
                    stopBarcodeScannerHistory();
                    const finalCode = cleanBarcode(decodedText);
                    document.getElementById('ledgerSearch').value = finalCode;
                    showToast("✅ Auditing Barcode: " + finalCode);
                    filterLedger();
                },
                (err) => {}
            );
        } catch (err) {
            showToast("❌ Scanner Error");
            document.getElementById('readerWrapperHistory').style.display = 'none';
        }
    });

    function stopBarcodeScannerHistory() {
        document.getElementById('readerWrapperHistory').style.display = 'none';
        if (historyScanner) {
            historyScanner.stop().catch(() => {}).finally(() => {
                historyScanner = null;
                document.getElementById('readerHistory').innerHTML = '';
            });
        }
    }
</script>
{% endblock %}
