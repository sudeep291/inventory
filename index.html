{% extends 'layout.html' %}
{% block content %}
<main class="dashboard-layout">
<style>
.welcome-slider-container {
    position: relative;
    margin: 4rem 0 5rem 0;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
}
.bg-slide {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    animation: bgFade 15s infinite;
    z-index: 0;
}
.bg-slide:nth-child(1) { animation-delay: 0s; }
.bg-slide:nth-child(2) { animation-delay: 5s; }
.bg-slide:nth-child(3) { animation-delay: 10s; }

@keyframes bgFade {
    0% { opacity: 0; transform: scale(1.05); }
    10% { opacity: 1; transform: scale(1); }
    33% { opacity: 1; transform: scale(1); }
    43% { opacity: 0; transform: scale(1.05); }
    100% { opacity: 0; transform: scale(1.05); }
}

body[data-theme='dark'] .welcome-overlay {
    background: radial-gradient(circle at center, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.4) 60%, rgba(15, 23, 42, 0.1) 100%) !important;
}
.welcome-overlay {
    position: relative;
    z-index: 2;
    padding: 5rem 2rem;
    text-align: center;
    background: radial-gradient(circle at center, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.5) 60%, rgba(255, 255, 255, 0.1) 100%);
    /* Removed heavy backdrop blur so HD images are visible */
}
</style>

    <div class="welcome-slider-container">
        <div class="bg-slide" style="background-image:url('/static/images/footwear_bg_1.png');"></div>
        <div class="bg-slide" style="background-image:url('/static/images/footwear_bg_2.png');"></div>
        <div class="bg-slide" style="background-image:url('/static/images/footwear_bg_3.png');"></div>
        
        <div class="welcome-overlay">
            <h1 style="font-size: 4rem; font-weight: 800; color: var(--text-primary); letter-spacing: -1px; text-shadow: 0px 4px 10px rgba(0,0,0,0.1); margin-bottom: 1rem; line-height:1.2;">
                Welcome <br> <span style="color: var(--primary);">Mr. Prathap Avula</span>
            </h1>
            <p style="font-size: 1.25rem; color: var(--text-secondary); font-weight: 600;">
                to Sri Vijayalakshmi Footwear Inventory System
            </p>
        </div>
    </div>
    
    <div class="summary-cards" id="dashCards"></div>
    
    <div class="table-container" style="margin-top:2rem">
        <div class="section-title"><h2>Critical Low Stock Alerts</h2></div>
        <table>
            <thead><tr><th>Article No</th><th>Product Name</th><th>Size</th><th>Stock Remaining</th></tr></thead>
            <tbody id="lowStockAlerts"></tbody>
        </table>
    </div>
</main>
{% endblock %}
{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', loadWelcomeDashboard);
</script>
{% endblock %}
